name: clang-format

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Verifier le formatage
        shell: bash
        run: |
          find src lib/accueil lib/batterie lib/horloge lib/meteo lib/reseau include \
            -type f \( -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
